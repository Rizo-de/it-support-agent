<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Support Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        #answer {
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }

        #questions {
            margin-top: 20px;
        }

        .question {
            margin-bottom: 20px;
        }

        .option {
            display: block;
            margin: 8px 0;
        }

        #sendAnswersButton {
            display: none;
        }

        .error {
            color: darkred;
        }
    </style>
</head>

<body>

    <h1>IT Support Agent</h1>

    <label for="issue">
        <strong>Beschreiben Sie Ihr IT-Problem:</strong>
    </label>

    <textarea
        id="issue"
        placeholder="Zum Beispiel: Mein Internet funktioniert nicht."
    ></textarea>

    <button onclick="sendProblem()">
        Problem analysieren
    </button>

    <div id="answer"></div>

    <div id="questions"></div>

    <button
        id="sendAnswersButton"
        onclick="sendAnswers()"
    >
        Antworten senden
    </button>


    <script>

        let conversationHistory = [];


        async function sendProblem() {

            const issue = document
                .getElementById("issue")
                .value
                .trim();

            if (!issue) {

                document.getElementById("answer").innerText =
                    "Bitte beschreiben Sie zuerst Ihr IT-Problem.";

                return;
            }

            conversationHistory = [];

            await sendToAgent(issue);
        }


        async function sendToAgent(message) {

            const answerElement =
                document.getElementById("answer");

            const questionsElement =
                document.getElementById("questions");

            answerElement.innerText =
                "Der IT Support Agent analysiert das Problem...";

            questionsElement.innerHTML = "";

            document.getElementById(
                "sendAnswersButton"
            ).style.display = "none";


            try {

                const response = await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            message: message,

                            history: conversationHistory

                        })
                    }
                );


                const contentType =
                    response.headers.get("content-type") || "";


                if (!contentType.includes("application/json")) {

                    const text =
                        await response.text();

                    throw new Error(
                        "Server hat keine JSON-Antwort zurückgegeben."
                    );
                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Serverfehler"
                    );
                }


                answerElement.innerText =
                    data.message || "";


                if (data.solution) {

                    answerElement.innerText +=
                        "\n\nLösung:\n" +
                        data.solution;
                }


                displayQuestions(
                    data.questions || []
                );


                conversationHistory.push({

                    role: "user",

                    content: message

                });


                conversationHistory.push({

                    role: "assistant",

                    content: JSON.stringify(data)

                });


            } catch (error) {

                answerElement.innerHTML =
                    '<span class="error">' +
                    "Verbindungsfehler: " +
                    error.message +
                    "</span>";
            }
        }


        function displayQuestions(questionList) {

            const container =
                document.getElementById("questions");

            container.innerHTML = "";


            if (!questionList.length) {

                return;
            }


            questionList.forEach(
                (question, questionIndex) => {

                    const questionDiv =
                        document.createElement("div");

                    questionDiv.className =
                        "question";


                    const title =
                        document.createElement("p");

                    title.innerHTML =
                        "<strong>" +
                        (questionIndex + 1) +
                        ". " +
                        question.question +
                        "</strong>";


                    questionDiv.appendChild(title);


                    const type =
                        question.type === "multiple"
                            ? "checkbox"
                            : "radio";


                    (question.options || []).forEach(
                        (option, optionIndex) => {

                            const label =
                                document.createElement("label");

                            label.className =
                                "option";


                            const input =
                                document.createElement("input");

                            input.type = type;

                            input.name =
                                "question_" +
                                questionIndex;

                            input.value =
                                option;


                            label.appendChild(input);

                            label.appendChild(
                                document.createTextNode(
                                    " " + option
                                )
                            );


                            questionDiv.appendChild(label);
                        }
                    );


                    container.appendChild(
                        questionDiv
                    );
                }
            );


            document.getElementById(
                "sendAnswersButton"
            ).style.display = "block";
        }


        function collectAnswers() {

            const answers = [];

            const questionElements =
                document.querySelectorAll(
                    ".question"
                );


            questionElements.forEach(
                (questionElement, index) => {

                    const selected =
                        questionElement.querySelectorAll(
                            "input:checked"
                        );


                    const values = [];


                    selected.forEach(
                        input => {

                            values.push(
                                input.value
                            );
                        }
                    );


                    answers.push(
                        `Frage ${index + 1}: ` +
                        values.join(", ")
                    );
                }
            );


            return answers.join("\n");
        }


        async function sendAnswers() {

            const answers =
                collectAnswers();


            if (!answers.trim()) {

                document.getElementById(
                    "answer"
                ).innerText =
                    "Bitte wählen Sie mindestens eine Antwort.";

                return;
            }


            await sendToAgent(
                answers
            );
        }

    </script>

</body>
</html>
