<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IT Support Agent</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
        }

        h1 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #answer {
            margin-top: 30px;
            padding: 20px;
            background: #f1f1f1;
            white-space: pre-wrap;
        }

        #questions {
            margin-top: 20px;
        }

        .question {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .question-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .option {
            display: block;
            margin: 8px 0;
        }

        #sendAnswersButton {
            display: none;
        }

        .error {
            color: #b00020;
            background: #ffecec;
            padding: 10px;
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <h1>IT Support Agent</h1>

    <p>
        Beschreiben Sie Ihr IT-Problem:
    </p>


    <textarea
        id="issue"
        placeholder="Zum Beispiel: Mein Internet funktioniert nicht."
    ></textarea>


    <br>


    <button
        id="sendProblemButton"
        onclick="sendProblem()"
    >
        Problem analysieren
    </button>


    <div id="answer"></div>


    <div id="questions"></div>


    <button
        id="sendAnswersButton"
        onclick="sendAnswers()"
    >
        Antworten senden
    </button>


    <script>

        let currentProblem = "";

        let conversationHistory = [];


        async function sendProblem() {

            const issue =
                document.getElementById("issue").value.trim();

            const answer =
                document.getElementById("answer");

            const questions =
                document.getElementById("questions");

            if (!issue) {

                answer.textContent =
                    "Bitte beschreiben Sie Ihr Problem.";

                return;
            }


            currentProblem = issue;

            conversationHistory = [];


            answer.textContent =
                "IT Support Agent analysiert das Problem...";

            questions.innerHTML = "";

            document.getElementById(
                "sendAnswersButton"
            ).style.display = "none";


            await sendToAgent(issue);

        }


        async function sendToAgent(message) {

            const answer =
                document.getElementById("answer");

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        message: message,

                        history: conversationHistory

                    })

                });


                const contentType =
                    response.headers.get("content-type") || "";


                if (!contentType.includes("application/json")) {

                    const text =
                        await response.text();

                    answer.innerHTML =
                        '<div class="error">' +
                        "Serverfehler: " +
                        text +
                        "</div>";

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    answer.innerHTML =
                        '<div class="error">' +
                        "Fehler: " +
                        (data.details || data.error) +
                        "</div>";

                    return;

                }


                conversationHistory.push({

                    role: "user",

                    content: message

                });


                conversationHistory.push({

                    role: "assistant",

                    content: JSON.stringify(data)

                });


                answer.textContent =
                    data.message || "";


                displayQuestions(
                    data.questions || []
                );


                if (data.solution) {

                    answer.textContent +=
                        "\n\nLösung:\n" +
                        data.solution;

                }

            }

            catch (error) {

                answer.innerHTML =
                    '<div class="error">' +
                    "Verbindungsfehler: " +
                    error.message +
                    "</div>";

            }

        }


        function displayQuestions(questionList) {

            const container =
                document.getElementById("questions");

            const sendButton =
                document.getElementById(
                    "sendAnswersButton"
                );


            container.innerHTML = "";


            if (!questionList.length) {

                sendButton.style.display = "none";

                return;

            }


            questionList.forEach(
                (question, questionIndex) => {

                    const questionDiv =
                        document.createElement("div");

                    questionDiv.className =
                        "question";


                    const title =
                        document.createElement("div");

                    title.className =
                        "question-title";

                    title.textContent =
                        question.question;


                    questionDiv.appendChild(title);


                    const options =
                        question.options || [];


                    options.forEach(
                        (option, optionIndex) => {

                            const label =
                                document.createElement(
                                    "label"
                                );

                            label.className =
                                "option";


                            const input =
                                document.createElement(
                                    "input"
                                );


                            input.type =
                                question.type === "multiple"
                                    ? "checkbox"
                                    : "radio";


                            input.name =
                                "question-" +
                                questionIndex;


                            input.value =
                                option;


                            label.appendChild(input);


                            label.appendChild(
                                document.createTextNode(
                                    " " + option
                                )
                            );


                            questionDiv.appendChild(
                                label
                            );

                        }
                    );


                    container.appendChild(
                        questionDiv
                    );

                }
            );


            sendButton.style.display =
                "inline-block";

        }


        function collectAnswers() {

            const questionDivs =
                document.querySelectorAll(
                    ".question"
                );


            const answers = [];


            questionDivs.forEach(
                (questionDiv, index) => {

                    const selected =
                        questionDiv.querySelectorAll(
                            "input:checked"
                        );


                    const values = [];


                    selected.forEach(
                        input => {

                            values.push(
                                input.value
                            );

                        }
                    );


                    answers.push({

                        question:
                            questionDiv
                                .querySelector(
                                    ".question-title"
                                )
                                .textContent,

                        answers: values

                    });

                }
            );


            return answers;

        }


        async function sendAnswers() {

            const answers =
                collectAnswers();


            const hasAnswer =
                answers.some(
                    item =>
                        item.answers.length > 0
                );


            const answer =
                document.getElementById("answer");


            if (!hasAnswer) {

                answer.textContent =
                    "Bitte beantworten Sie mindestens eine Frage.";

                return;

            }


            const message =
                "Der Benutzer hat folgende Fragen beantwortet:\n\n" +
                JSON.stringify(
                    answers,
                    null,
                    2
                );


            answer.textContent =
                "IT Support Agent wertet die Antworten aus...";


            document.getElementById(
                "questions"
            ).innerHTML = "";


            document.getElementById(
                "sendAnswersButton"
            ).style.display = "none";


            await sendToAgent(message);

        }

    </script>

</body>

</html>
